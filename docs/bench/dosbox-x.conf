# DOSBox-X 2026.08.31 (Homebrew), for DOOM -timedemo demo1.
# Its own built-in DOS, not MS-DOS 6.22: DOOM.EXE and DOOM1.WAD in a
# mounted host folder. doom-timedemo.sh fills in the mount path.
[sdl]
output=surface
[dosbox]
memsize=16
[cpu]
# dynamic is DOSBox-X's dynrec on arm64 (494 realtics); normal gave 1,270
core=dynamic
cputype=auto
cycles=max
[autoexec]
mount c "@DOOMDIR@"
c:
doom -timedemo demo1 > td.txt
exit
